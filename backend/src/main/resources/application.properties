# TripSathi Spring Boot Server Configuration
server.port=4000

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/tripsathi_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Security Configurations
jwt.secret=TripSathiSuperSecretKey2026MustBeAtLeast32BytesLongForHS256Security!
jwt.expirationMs=864000000
