# TripSathi H2 Development Database Configuration
server.port=4000

spring.datasource.url=jdbc:h2:mem:tripsathi_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

jwt.secret=TripSathiSuperSecretKey2026MustBeAtLeast32BytesLongForHS256Security!
jwt.expirationMs=864000000
